name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Login en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build imagen Frontend y push a Docker Hub
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest

    - name: Desplegar Frontend en AWS vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest
          docker stop tienda-frontend || true
          docker rm tienda-frontend || true
          docker run -d --name tienda-frontend -p 80:80 ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest
          