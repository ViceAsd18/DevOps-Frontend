name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: [ "master" ]

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    # 1. Configurar credenciales de AWS usando los Secrets que guardamos (CON SESSION TOKEN)
    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # <-- Mapeado el token del lab
        aws-region: ${{ secrets.AWS_REGION }}

    # 2. Login oficial en Amazon ECR
    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 3. Build imagen Frontend, push a Amazon ECR y registrar salida de imagen
    - name: Build imagen Frontend y push a Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: tienda-frontend
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # =============================================================
    # DESPLIEGUE MODERNO NATIVO EN AMAZON ECS (FARGATE)
    # =============================================================

    # 4. Inyectar dinámicamente la nueva URI de la imagen en tu archivo local task-definition.json
    - name: Registrar la nueva imagen en la Task Definition de ECS
      id: render-web-container
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: tienda-frontend
        image: ${{ steps.build-image.outputs.image }}

    # 5. Desplegar la nueva definición de tarea en el servicio de ECS y esperar estabilidad
    - name: Desplegar Definición de Tarea en Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render-web-container.outputs.task-definition }}
        service: servicio-frontend
        cluster: cluster-tienda-perritos
        wait-for-service-stability: true